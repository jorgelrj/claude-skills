# yaml-language-server: $schema={{schema-path}}
# TEMPO repo config. Every key is optional; delete what you do not need.
# Values here override the workspace file and the built-in defaults.
version: 1

# toolchain: maven21            # a toolchain from the workspace file

env: {}                         # exported for every command, e.g. JAVA_HOME

commands:                       # null = not available; unset = detect from the repo
  test: npm test
  test_one: npm test -- {pattern}
  build: npm run build
  typecheck: npm run typecheck
  lint: npm run lint
  run_app: null                 # older form of one qa surface; prefer qa: below

# qa:                           # how QA runs the product to show each criterion working (config SKILL 2.8)
#   live: true                  # false only for a repo with nothing to run (a library)
#   surfaces:                   # in start order; a surface's needs name earlier ones; replaces the workspace list
#     - name: api
#       kind: api                 # service | api | web | android | ios | cli
#       start: npm run dev
#       ready: "listening on"     # regex in the start output
#       url: http://localhost:3000
#       health: curl -fsS http://localhost:3000/health
#       paths: [server/**]        # only when a change touches these; none: always
#     - name: web
#       kind: web
#       needs: [api]
#       start: npm run dev:web
#       url: http://localhost:5173
#   accounts:                   # real values in .tempo/config.local.yaml, never here
#     - {role: admin, user: "${env:QA_ADMIN_EMAIL}", password: "${env:QA_PASSWORD}"}
#   seed: npm run seed          # run once after the surfaces are up

git:
  base_branch: main
  branch: "{type}/{ticket}"     # task branch = integration branch = PR branch, the only one pushed; no ticket: a slug
                                # {type}: feat, fix, chore ...; never tempo/..., never a local T-NNN id
  # branch_types: {feat: feature, fix: bugfix}   # when the repo's branches use other words than the types
  work_order_branch: "tempo/{name}-wo-{nn}"   # tempo/ = local only, never pushed; {name} = the task branch without its type word
  repro_branch: "tempo/{name}-repro"
  worktree_root: .tempo/worktrees
  commit:
    message: "{type}({ticket}): {summary}"
    language: en
    extra_args: []              # e.g. [--no-verify]

pr:
  draft: true
  tool: gh                      # gh | none
  title: "{type}({ticket}): {summary}"
  language: en
  # required_checks: [ci-gate, ai-review]   # CI-WAIT waits until these report (a late commit status is not yet pending)

# targets:                      # extra platform test runs, e.g. Flutter on Chrome
#   - name: web
#     command: cd app && flutter test --platform chrome            # the whole suite (rarely run)
#     scoped_command: cd {package} && flutter test --platform chrome {tests}   # just the tests a change touches
#     advisory: true              # red on the base branch: only failures the base lacks block
#     run: critical               # critical changes and /tempo:verify only (default for advisory); final: once after the last wave; routine: every integrate
#     paths: [app/lib/**, app/test/**]

# tests:                        # repo-relative test files that need their own handling
#   always: []                  # run at every NARROW integrate, whatever it touches
#   slow: []                    # run filtered while building, whole once after the last wave

gates:
  full_bars: on_demand          # on_demand: full suite for critical changes and /tempo:verify; integrate: every task; ci: the PR's CI runs it (see limits.ci_rounds)
  # full_paths: []              # files whose change forces full bars (default: lockfiles and toolchain pins)

worktree:                       # a new worktree has only tracked files
  copy: []                      # gitignored files to copy, e.g. [.env.local]
  link: []                      # big gitignored folders to symlink, e.g. [node_modules, app/.fvm]
  setup: []                     # commands run inside the new worktree, in order; {worktree} is a safe name
  teardown: []                  # commands run before SHIP removes the worktree, e.g. dropdb app_{worktree}
  env: {}

docs:                           # the project's own docs; agents read them before searching the code
  paths: []                     # folders, globs (docs/**/*.md) or regexes (re:^svc/[^/]+/docs/), relative to the repo root
  exclude: []                   # globs or re: regexes to drop
  rules: true                   # conventions, ADRs and design-system docs count as review rules

limits:
  max_parallel_builders: 3
  review_rounds: 3
  review_extensions: 1
  narrow_fix_lines: 40
  qa_rounds: 3
  ci_rounds: 0                  # above 0: wait on the PR's checks after SHIP, fix them, end when merged (needs pr.draft: false)
  repro_hypotheses: 3
  repro_minutes: 30

distill:
  suggest_after: 10             # finished sessions under .tempo/ before TEMPO suggests /tempo:distill once (0 = never)
  abandoned_after_days: 30      # unshipped sessions idle this long: /tempo:distill offers them, with approval (0 = never)
  archive_days: 90              # .tempo/archive/ folders this old: /tempo:distill offers to delete them (0 = never)

task:
  id: ticket                    # ticket | sequence
  ticket_pattern: "[A-Z][A-Z0-9]+-\\d+"
  tracker: none                 # jira | github | linear | none
  # Several trackers, each with an opt-in sync (replaces tracker and ticket_pattern):
  # trackers:
  #   - type: github
  #     ticket_pattern: "(?:#|/issues/)(\\d+)"
  #     sync: {assign: true, start: In progress, pr: In review, project: my-org/4}
  #   - type: jira
  #     ticket_pattern: "\\b(ABC-\\d+)\\b"
  #     sync: {assign: true, start: In Progress}
  # autopilot: true             # accept TEMPO's own recommendations; stop only where orchestrator §4.5 says
