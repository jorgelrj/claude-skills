# TEMPO built-in defaults. Do not edit per project: override in
# <workspace>/.tempo/workspace.yaml or <repo>/.tempo/config.yaml.
version: 1
commands:
  test: null        # detected from the repo when null
  test_one: null
  build: null
  typecheck: null
  lint: null
  run_app: null
git:
  base_branch: main
  branch: "tempo/{task}"
  work_order_branch: "{branch}-wo-{nn}"
  repro_branch: "{branch}-repro"
  worktree_root: .tempo/worktrees
  delete_merged_local_branches: true
  commit:
    message: "{type}({task}): {summary}"
    language: en
    extra_args: []
pr:
  draft: true
  tool: gh
  title: "{type}({task}): {summary}"
  language: en
worktree:
  copy: []
  link: []
  setup: []
  env: {}
limits:
  max_parallel_builders: 3
  review_rounds: 3
  qa_rounds: 3
  repro_hypotheses: 3
  repro_minutes: 30
task:
  id: ticket
  ticket_pattern: "[A-Z][A-Z0-9]+-\\d+"
  tracker: none
