# TEMPO built-in defaults. Do not edit per project: override in
# <workspace>/.tempo/workspace.yaml or <repo>/.tempo/config.yaml.
version: 1
commands:
  test: null        # detected from the repo when null
  test_one: null
  test_local: null  # gates.full_bars: ci only: the test-one command that skips what only CI runs
  build: null
  build_scoped: null  # build for one package, with {package}: NARROW and LOCAL integrates run it per touched package
  typecheck: null
  lint: null
  lint_scoped: null   # lint for one package, with {package}, as build_scoped
  run_app: null
targets: []        # extra platform test runs: [{name, command, paths, scoped_command?, advisory?, run?}]; run: ci never runs locally
tests:
  always: []       # test files run at every NARROW integrate, whatever packages it touches
  slow: []         # test files run filtered by builders and QA, whole once at the integrate after the last wave
qa:
  live: true       # QA shows each criterion working in the running product; false only for a repo with nothing to run (a library)
  surfaces: []     # what QA starts and watches, in start order: [{name, kind, start, ready?, stop?, url?, health?, screenshot?, needs?, paths?}]
  accounts: []     # sign-ins QA uses: [{role, user, password?}]; secrets as ${env:NAME}, real values in config.local.yaml
  seed: null       # command that creates the data and accounts QA needs, run once after the surfaces are up
gates:
  full_bars: on_demand    # on_demand: Integrate runs NARROW bars; the full suite runs for critical changes and on /tempo:verify. integrate: every task's final integrate runs it. verify: never inside a task, only on /tempo:verify or the branch the task merges into. ci: LOCAL bars (touched tests, one typecheck, lint); the PR's CI runs the rest
  full_paths:             # a change to one of these is wide enough to run FULL bars
    - "**/pubspec.lock"
    - "**/melos.yaml"
    - "**/pnpm-lock.yaml"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/poetry.lock"
    - "**/uv.lock"
    - "**/Cargo.lock"
    - "**/go.sum"
    - "**/.fvmrc"
  no_code_paths: []      # globs added to the built-in no-code set (*.md, .rst, .txt and .adoc under docs/, images, LICENSE); a diff of only these runs BARS: NONE
git:
  base_branch: main
  branch: "{type}/{ticket}"    # pushed, opens the PR: feat/AV-1, fix/fix-safari-export. {ticket} is the key, else a slug
  branch_types: {}             # type -> the repo's branch word, e.g. {feat: feature, fix: bugfix}; empty: read from remote branches
  work_order_branch: "tempo/{name}-wo-{nn}"   # tempo/ = local only, never pushed; {name} = the task branch without its type word
  repro_branch: "tempo/{name}-repro"
  worktree_root: .tempo/worktrees
  delete_merged_local_branches: true
  fold_fixes: true        # fixes before the PR become fixup! commits, squashed into their owner commit at SHIP
  commit:
    message: "{type}({ticket}): {summary}"   # no ticket: "{type}: {summary}"
    language: en
    extra_args: []
pr:
  draft: true
  tool: gh
  title: "{type}({ticket}): {summary}"
  language: en
worktree:
  copy: []
  link: []
  setup: []
  teardown: []
  before_run: []
  env: {}
limits:
  max_parallel_builders: 3
  review_rounds: 3
  review_extensions: 1
  narrow_fix_lines: 40
  qa_rounds: 3
  ci_rounds: 0            # above 0: after SHIP the task waits on the PR's checks (CI-WAIT), fixes them, and ends when the PR merges
  repro_hypotheses: 3
  repro_minutes: 30
  split_orders: 4         # more Work Orders than this: HANDOFF splits the task into stacked slices (0 = off)
  split_criteria: 30      # more criteria than this also splits (0 = off)
  order_check: true       # quick review of each Work Order's diff before it integrates (M and L lanes)
  spec_slice_kb: 30       # Spec larger than this: each order carries the terms and design it needs (0 = off)
  heavy_max_load: 1.5     # a heavy run waits, holding its slot, while the 1-minute load per CPU is above this (0 = off)
  heavy_min_free_mb: 0    # ...or while free memory is under this many MB (0 = off)
  heavy_load_wait_minutes: 20  # past this the heavy run starts anyway
  heavy_slots: 0          # heavy runs at once, machine-wide (0 = CPUs / 4, at least 1); per machine in config.local.yaml
distill:
  suggest_after: 10       # finished sessions under .tempo/ before the orchestrator suggests /tempo:distill once (0 = never)
  abandoned_after_days: 30  # FAILED, ABORTED, closed-unmerged or no-PR sessions idle this long are offered to clear, with approval (0 = never)
  archive_days: 90        # folders in .tempo/archive/ this old are offered for deletion, with approval (0 = never)
task:
  id: ticket
  ticket_pattern: "[A-Z][A-Z0-9]+-\\d+"
  tracker: none
  standing_decisions: []  # Jorge's standing answers; applied instead of GATE-CLARIFY
  autopilot: false        # true: every task runs as if --auto were given (orchestrator §4.5)
