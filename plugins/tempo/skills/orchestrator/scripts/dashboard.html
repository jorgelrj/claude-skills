<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMPO</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: dark;
  --bg: #0d1117; --panel: #161b22; --card: #1c2128; --line: #30363d; --fg: #e6edf3; --dim: #9198a1;
  --ok: #3fb950; --warn: #e3a13a; --bad: #ff7b72; --info: #6cb6ff; --glow: rgba(255, 123, 114, .45);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f3f4f6; --panel: #ffffff; --card: #ffffff; --line: #d0d7de; --fg: #1f2328; --dim: #57606a;
    --ok: #1a7f37; --warn: #8a5a00; --bad: #c62828; --info: #0b5cad; --glow: rgba(198, 40, 40, .35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
code, pre, .mono, .id, .meta, .cmd { font-family: var(--mono); font-size: 12px; }
a, .lnk { color: var(--info); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.dim { color: var(--dim); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline;
  padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 14px; letter-spacing: .08em; }
h1 span { font-weight: 400; letter-spacing: 0; }
#status { margin-left: auto; font-family: var(--mono); font-size: 12px; }
#filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 4px; }
#filters .gap { flex: 1; }
#board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; padding: 6px 16px 24px; align-items: start; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--dim); padding: 18vh 0; }
.col { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.col h2 { display: flex; justify-content: space-between; margin: 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.col > p { margin: 8px 2px 0; }

.card { display: grid; gap: 5px; min-width: 0; margin-top: 8px; padding: 8px; background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; cursor: pointer; overflow-wrap: anywhere; }
.card:hover { border-color: var(--dim); }
.card.wait { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad), 0 0 12px var(--glow); }
.card.fail { border-left: 3px solid var(--bad); }
.card.done { background: none; }  /* dimmed by colour, not opacity: the chips keep their contrast */
.card.done .id, .card.done .title { color: var(--dim); font-weight: 400; }
.hd, .chips, .vr, .kid { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
.id { font-weight: 600; font-size: 13px; }
.title { font-weight: 500; }
.vl { min-width: 26px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { color: var(--dim); font-size: 11px; }
.wt { margin: 0; padding: 6px; max-height: 7.5em; overflow: hidden; white-space: pre-wrap; font-size: 11px; background: var(--bg); border-radius: 4px; }
.cmd { padding: 1px 5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; user-select: all; }
.kids { display: grid; gap: 3px; padding-top: 5px; border-top: 1px solid var(--line); }
.kid button { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; flex: 1; min-width: 0; padding: 2px 4px; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
.kid button:hover { border-color: var(--line); }

.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
.dot.off { background: none; border: 1px solid var(--dim); animation: none; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.75); } }
.chip { display: inline-block; max-width: 100%; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
  font-size: 11px; line-height: 17px; color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 9px; }
.chip.ok { color: var(--ok); border-color: currentColor; }
.chip.warn { color: var(--warn); border-color: currentColor; }
.chip.bad, .chip.need { color: var(--bad); border-color: currentColor; }
.chip.need { font-weight: 600; }
.chip.info { color: var(--info); }
.chip.stage { color: var(--fg); font-family: var(--mono); border-radius: 4px; }
.chip.off { border-style: dashed; }
.chip.run { color: var(--info); border-color: var(--info); animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 50% { border-color: transparent; } }
#fhead .chip { padding: 1px 10px; font-size: 12px; font-weight: 600; }
.tog { cursor: pointer; line-height: 20px; }
.tog[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); font-weight: 600; }

#scrim { position: fixed; inset: 0; z-index: 9; background: rgba(0, 0, 0, .45); }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 10; width: min(1280px, 94vw); display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); visibility: hidden;
  transition: transform .18s ease, visibility .18s; }
#drawer.open { transform: none; visibility: visible; }
#dhead { display: grid; gap: 5px; padding: 12px 52px 10px 16px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
#dhead .title { font-size: 15px; }
#close { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; font-size: 18px; line-height: 1; cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 6px; }
#dbody { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); min-height: 0; }
#side { overflow-y: auto; padding: 4px 16px 24px; border-right: 1px solid var(--line); overflow-wrap: anywhere; }
#pane { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
#fhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
#fhead:empty { display: none; }
#fbody { overflow: auto; padding: 8px 16px 24px; }
#side h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#side table { width: 100%; border-collapse: collapse; }
#side th { font-size: 11px; font-weight: 400; color: var(--dim); }
#side th, #side td { padding: 2px 10px 2px 0; text-align: left; vertical-align: top; }
/* a long path in the last column must wrap there, not squeeze the label column to one word per line */
#side td { overflow-wrap: normal; }
#side td:last-child { overflow-wrap: anywhere; }
#side p { margin: 4px 0; }
#side .wt { max-height: none; font-size: 12px; }
.lnk { padding: 0; text-align: left; text-decoration: underline; font-family: var(--mono); font-size: 12px; background: none; border: 0; cursor: pointer; }
.dec { margin: 0 0 8px; padding-left: 8px; border-left: 2px solid var(--line); }
.fg { margin-bottom: 8px; }
.file { display: flex; gap: 6px; width: 100%; padding: 1px 4px; text-align: left; font-family: var(--mono); font-size: 12px;
  background: none; border: 0; border-radius: 4px; cursor: pointer; }
.file:hover { background: var(--card); }
.file.sel { background: var(--card); box-shadow: inset 2px 0 0 var(--info); font-weight: 600; }
.vd { flex: none; width: 12px; text-align: center; }

.raw { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.md { max-width: 90ch; overflow-wrap: anywhere; }
.md h1 { font-size: 18px; } .md h2 { font-size: 15px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
.md h3, .md h4, .md h5, .md h6 { font-size: 13px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 18px 0 6px; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md .tw { margin: 6px 0; }
.md ul, .md ol { padding-left: 22px; }
.md code { padding: 0 3px; background: var(--bg); border-radius: 3px; }
.md pre { padding: 8px; overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.md pre code { padding: 0; background: none; }
.md blockquote { padding: 1px 10px; color: var(--dim); border-left: 3px solid var(--line); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md .tw { overflow-x: auto; }
.md table { border-collapse: collapse; }
.md th, .md td { padding: 3px 8px; text-align: left; vertical-align: top; border: 1px solid var(--line); }

@media (max-width: 900px) {
  #drawer { width: 100vw; }
  #dbody { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
  #side { overflow: visible; border-right: 0; }
  #pane { border-top: 1px solid var(--line); }
  #fbody { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="page">
  <header>
    <h1>TEMPO <span id="host" class="dim"></span></h1>
    <span id="counts"></span>
    <span id="status" class="dim">connecting…</span>
  </header>
  <nav id="filters" aria-label="Filters"></nav>
  <main id="board"><p class="empty">Loading…</p></main>
</div>
<div id="scrim" data-close hidden></div>
<aside id="drawer" role="dialog" aria-label="Task details">
  <div id="dhead"></div>
  <button id="close" type="button" data-close aria-label="Close">×</button>
  <div id="dbody">
    <div id="side"></div>
    <div id="pane"><div id="fhead"></div><div id="fbody"></div></div>
  </div>
</aside>
<script>
'use strict';
// Part 1: pure functions (data in, HTML string out), free of the DOM so Node can load and test them.

const COLS = [
  ['plan', 'Plan', ['TRIAGE', 'EXPLORE', 'INVESTIGATE', 'REPRODUCE', 'ROOT-CAUSE', 'SPEC', 'HANDOFF', 'PLAN', 'SLICES']],
  ['build', 'Build', ['BUILD', 'REPOS']],
  ['integrate', 'Integrate', ['INTEGRATE']],
  ['review', 'Review', ['REVIEW']],
  ['qa', 'QA', ['QA', 'JOINT-QA']],
  ['ship', 'Ship', ['SHIP']],
  ['needs', 'Needs Jorge', []],
  ['done', 'Done', []],
];
const ENDED = ['DONE', 'FAILED', 'ABORTED'];
const WAIT = 'WAITING-ON-JORGE';
const SYM = {ok: '✓', bad: '✗', warn: '△', need: '!', run: '◌', off: '○'};
const WO = {DONE: 'ok', BUILDING: 'run', BLOCKED: 'bad'};
const RUN = {'waiting for a slot': 'warn', running: 'run', gone: 'off'};
const GOOD = ['PASS', 'DONE', 'REPRODUCED'], BAD = ['FAIL', 'BLOCKED', 'FAILED', 'ABORTED', 'NOT REPRODUCED'];
const COARSE = /^\d{4}-\d\d-\d\d \d\d:\d\d$/;

const HTML = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => HTML[c]); }
// API values are used as map keys: never let "constructor" or "__proto__" reach the prototype.
function pick(map, key, fallback) { return Object.prototype.hasOwnProperty.call(map || {}, key) ? map[key] : fallback; }
function safeUrl(u) { return /^https?:\/\/[^\s]+$/i.test(String(u || '')) ? String(u) : null; }
const st = t => t.state || {};
const norm = p => String(p || '').replace(/\/+$/, '');

// UTC offset in minutes of an ISO time ("…-03:00"); the browser's own when there is none.
function offsetOf(iso) {
  const m = /([+-])(\d\d):?(\d\d)$/.exec(iso || '');
  return m ? (m[1] === '-' ? -1 : 1) * (m[2] * 60 + +m[3]) : /Z$/.test(iso || '') ? 0 : -new Date().getTimezoneOffset();
}
// "YYYY-MM-DD HH:MM" is the server's local time, so it needs the server's offset; ISO strings carry their own.
function parseTime(s, off) {
  if (typeof s === 'number') return s;
  if (typeof s !== 'string') return NaN;
  const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?$/.exec(s.trim());
  return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) - (off || 0) * 60000 : Date.parse(s);
}
function fmtDur(ms, coarse) {
  if (!isFinite(ms)) return '–';
  const s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60);
  return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m >= 1 || coarse ? m + 'm' : s + 's';
}
const shortTime = s => String(s || '').slice(5, 16).replace('T', ' ');
// A duration: fixed text when it ended; otherwise an empty span that tick() fills every second, so the
// HTML depends on the data only and an unchanged section is never replaced.
function clock(start, end, ctx) {
  const a = parseTime(start, ctx.off), coarse = COARSE.test(start);
  if (!isFinite(a)) return '';
  if (end == null) return `<span data-since="${a}"${coarse ? ' data-coarse' : ''}></span>`;
  return esc(fmtDur(parseTime(end, ctx.off) - a, coarse));
}

function columnOf(t) {
  const s = st(t);
  if (s.status === WAIT) return 'needs';
  if (ENDED.includes(s.status) || s.stage === 'DONE' || s.stage === 'PLANNED') return 'done';
  const c = COLS.find(c => c[2].includes(s.stage));
  return c ? c[0] : 'plan';  // an unknown stage keeps its card
}
function endMs(t, ctx) {
  const log = st(t).log || [], e = log[log.length - 1], v = e ? parseTime(e[e.length - 4], ctx.off) : NaN;
  return isFinite(v) ? v : (t.mtime || 0) * 1000;
}
const total = (t, ctx) => clock(st(t).started, columnOf(t) === 'done' ? endMs(t, ctx) : null, ctx);

// Children are matched by exact folder, and everything is keyed by tag: a parent and its child share a task name.
function nest(tasks) {
  const byDir = new Map(tasks.map(t => [norm(t.dir), t])), kids = new Map(), parentOf = new Map();
  for (const t of tasks) {
    kids.set(t.tag, Object.entries(st(t).children || {}).map(([name, info]) => {
      const c = byDir.get(norm(info && info.folder));
      if (c && c !== t) parentOf.set(c.tag, t);
      return {name, info: info || {}, task: c && c !== t ? c : null};
    }));
  }
  return {top: tasks.filter(t => !parentOf.has(t.tag)), kids, parentOf};
}
function counts(tasks, n) {
  return {running: n.top.filter(t => st(t).status === 'RUNNING' && columnOf(t) !== 'done' && t.alive !== false).length,  // a task whose session is gone is not running
          waiting: tasks.filter(t => st(t).status === WAIT).length,
          finished: n.top.filter(t => columnOf(t) === 'done').length};
}

// A path as the task folder knows it: agents record ".tempo/<task>/x.md" or an absolute path.
function rel(t, p) {
  p = String(p || '');
  const d = norm(t.dir) + '/', mark = '.tempo/' + t.task + '/';
  return p.startsWith(d) ? p.slice(d.length) : p.includes(mark) ? p.slice(p.lastIndexOf(mark) + mark.length) : p;
}
function relPath(t, p) { p = rel(t, p); return p && (t.files || []).includes(p) ? p : null; }
function defaultFile(t) {
  const log = st(t).log || [], e = log[log.length - 1];
  return relPath(t, st(t).waiting) || (e && relPath(t, e[e.length - 2])) || relPath(t, 'task.md') || (t.files || [])[0] || null;
}

function vClass(v) {
  v = String(v || '').toUpperCase();
  return GOOD.includes(v) ? 'ok' : BAD.includes(v) ? 'bad' : 'warn';
}
// cls is always a literal from this file; text is data; html is trusted markup from clock().
function chip(cls, text, title, html) {
  return `<span class="chip ${cls}"${title ? ` title="${esc(title)}"` : ''}>${SYM[cls] ? SYM[cls] + ' ' : ''}${esc(text)}${html ? ' ' + html : ''}</span>`;
}
function statusChip(x) {
  return !x ? '' : x === 'RUNNING' ? chip('run', 'running') : x === WAIT ? chip('need', 'waiting on Jorge') : x === 'DONE' ? chip('ok', 'done') : chip('bad', x);
}
function prLink(u) {
  if (!u) return '';
  const url = safeUrl(u), m = /\/pull\/(\d+)/.exec(u);
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${m ? 'PR #' + m[1] : 'PR'}</a>` : `<span class="dim">${esc(u)}</span>`;
}
function tags(s) {
  return (s.flow ? chip('plain', s.flow) : '') + (s.lane ? chip('plain', 'lane ' + s.lane) : '') + (s.critical ? chip('warn', 'Critical') : '') +
    (s.autopilot ? chip('info', 'Autopilot') : '') + (s.mode === 'PLAN-ONLY' ? chip('plain', 'Plan-only') : '');
}
function fileBtn(p, label, key) {
  return p ? `<button type="button" class="lnk" data-file="${esc(p)}" data-f="${esc(key)}">${esc(label)}</button>` : `<span class="mono">${esc(label)}</span>`;
}

// Review rounds and QA come from the files that exist ("results", "files", agents in flight). The counters only
// add a round that has no file yet: they lag (qa) and skip numbers (a double bump) in real runs.
function verdicts(t) {
  const s = st(t), running = s.status === 'RUNNING', R = new Map(), results = t.results || {};
  const round = n => R.get(n) || R.set(n, {n, lenses: [], verdict: null, run: false}).get(n);
  const lens = (p, flying) => {
    const m = /^review\/(.+)-r(\d+)\.md$/.exec(p || '');
    if (!m) return;
    const ls = round(+m[2]).lenses, cur = ls.find(l => l.name === m[1]) || ls[ls.push({name: m[1], verdict: pick(results, p, null), run: false}) - 1];
    if (flying) cur.run = true;
  };
  (t.files || []).forEach(f => lens(f));
  Object.keys(results).forEach(k => { lens(k); const m = /^findings-r(\d+)\.md$/.exec(k); if (m) round(+m[1]).verdict = results[k]; });
  (t.agents || []).forEach(a => {
    if (a.ended) return;
    const p = rel(t, a.output), m = /^findings-r(\d+)\.md$/.exec(p);
    lens(p, true);
    if (m) round(+m[1]).run = true;
  });
  const bumped = +(s.counters || {}).review || 0;
  if (bumped > Math.max(0, ...R.keys())) round(bumped);
  const todo = columnOf(t) !== 'done' && s.mode !== 'PLAN-ONLY' && s.flow !== 'WORKSPACE';
  if (!R.size && todo) round(1);
  const rounds = [...R.values()].sort((a, b) => a.n - b.n), last = rounds[rounds.length - 1];
  if (last && running && s.stage === 'REVIEW') last.run = true;
  const qa = Object.keys(results).map(k => /^qa(?:-joint)?-r(\d+)\.md$/.exec(k)).filter(Boolean)
    .map(m => ({n: +m[1], verdict: results[m[0]]})).sort((a, b) => a.n - b.n);
  return {int: pick(results, 'integration.md', null), intRun: running && s.stage === 'INTEGRATE', rounds, qa,
          qaRun: running && (s.stage === 'QA' || s.stage === 'JOINT-QA'), todo};
}
function verdictRows(t) {
  const v = verdicts(t), row = (k, chips) => `<div class="vr"><span class="vl">${k}</span>${chips}</div>`;
  let h = '';
  if (v.int || v.intRun) h += row('INT', v.intRun ? chip('run', 'integrating') : chip(vClass(v.int), v.int));
  for (const r of v.rounds) {
    h += row('R' + r.n, r.lenses.map(l => chip(l.run ? 'run' : l.verdict ? vClass(l.verdict) : 'plain', l.name, l.verdict || (l.run ? 'in progress' : 'written'))).join('') +
      (r.verdict ? chip(vClass(r.verdict), r.verdict) : r.run ? chip('run', 'reviewing') : chip('off', r.lenses.length ? 'no verdict' : 'not started')));
  }
  if (v.qa.length || v.qaRun || v.todo) {
    h += row('QA', v.qa.map(q => chip(vClass(q.verdict), 'r' + q.n + ' ' + q.verdict)).join('') +
      (v.qaRun ? chip('run', 'running', t.qa_progress) : v.qa.length ? '' : chip('off', 'not started')));
  }
  return h;
}
function newestRun(t) {
  const runs = t.runs || [], last = s => runs.filter(r => r.state === s).pop();
  return last('running') || last('waiting for a slot') || null;
}

function renderCard(t, n, ctx) {
  const s = st(t), fin = columnOf(t) === 'done', waiting = s.status === WAIT, failed = s.status === 'FAILED' || s.status === 'ABORTED';
  const kids = n.kids.get(t.tag) || [], kidState = k => k.task ? st(k.task) : k.info;
  const fly = (t.agents || []).filter(a => !a.ended), run = newestRun(t), wos = s.work_orders || {};
  const cls = 'card' + (waiting || kids.some(k => kidState(k).status === WAIT) ? ' wait' : '') + (failed ? ' fail' : fin ? ' done' : '');
  const woRow = Object.keys(wos).sort().map(k => {
    const w = wos[k] || {}, x = w.status || 'ISSUED';
    return chip(pick(WO, x, 'off'), k + (x === 'BLOCKED' ? ' blocked' : ''), x.toLowerCase(), clock(w.started, w.finished || (fin ? endMs(t, ctx) : null), ctx));
  }).join('');
  const kidRows = kids.map(k => {
    const c = k.task, cs = kidState(k);
    const inner = `<span class="mono">${esc(k.name)}</span><span class="chip stage">${esc(cs.stage || 'NOT STARTED')}</span>${statusChip(cs.status)}<span class="meta">` +
      (c ? total(c, ctx) : cs.ended ? clock(cs.started, cs.ended, ctx) : ENDED.includes(cs.status) ? '' : clock(cs.started, null, ctx)) + '</span>';
    return `<div class="kid">${c ? `<button type="button" data-open="${esc(c.tag)}" data-f="k${esc(t.tag + c.tag)}">${inner}</button>` : inner}${prLink(cs.pr)}</div>`;
  }).join('');

  }
  function closeDrawer() {
    history.replaceState(null, '', location.pathname + location.search);
    sync(true);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('a, button, [data-open], [data-close]');
    if (!el || el.tagName === 'A') return;
    const d = el.dataset;
    if ('close' in d) closeDrawer();
    else if ('file' in d) {
      file = d.file;
      render();
      if (matchMedia('(max-width: 900px)').matches) $('pane').scrollIntoView();  // the pane sits below the lists there
    } else if ('filter' in d) {
      ui.checkouts = !d.filter ? [] : ui.checkouts.includes(d.filter) ? ui.checkouts.filter(c => c !== d.filter) : ui.checkouts.concat(d.filter);
      persist(); render();
    } else if ('finished' in d) {
      ui.finished = !ui.finished;
      persist(); render();
    } else if (d.open) go(d.open);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && open) closeDrawer();
    else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card')) { e.preventDefault(); go(e.target.dataset.open); }
  });
  addEventListener('hashchange', () => sync(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(timer); else poll(); });
  setInterval(tick, 1000);
  sync(false);
  poll();
})();
</script>
</body>
</html>
